# Standalone mock IdP for SAML testing -- run with:
#   docker compose -f docker-compose.mock-idp.yml up -d
# Stop with:
#   docker compose -f docker-compose.mock-idp.yml down
services:
  mock-idp:
    image: kenchan0130/simplesamlphp:latest
    container_name: cviche-mock-idp
    ports:
      - "8443:8080"
    environment:
      SIMPLESAMLPHP_SP_ENTITY_ID: "https://cviche.med.cornell.edu/shibboleth"
      SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: "http://localhost:8000/api/saml/acs"
      SIMPLESAMLPHP_SP_SINGLE_LOGOUT_SERVICE: "http://localhost:8000/api/saml/logout"
    volumes:
      - ./mock-idp/saml20-idp-hosted.php:/var/www/simplesamlphp/metadata/saml20-idp-hosted.php

# SP signing/decryption keypair for the CViche SAML Service Provider.
#
# This file is a reference shape -- the actual Secret is created imperatively
# from local files at apply time so the private key never gets committed.
#
# === Apply recipe ===
#
# Source the private key from 1Password (item: "CViche -- SAML SP private key (prod)")
# into a tmp file you delete after applying. Public cert lives at
# ~/cviche-saml-sp-prod.crt.pem (also embedded in saml-its-form-prod.md).
#
#   # 1) Stage the keypair locally
#   op item get "CViche -- SAML SP private key (prod)" --fields label="private key" --reveal > /tmp/sp.key.pem
#   cp ~/cviche-saml-sp-prod.crt.pem /tmp/sp.crt.pem
#
#   # 2) Apply the Secret
#   kubectl -n cviche-dev create secret generic cviche-saml-sp-cert \
#     --from-file=sp.crt=/tmp/sp.crt.pem \
#     --from-file=sp.key=/tmp/sp.key.pem \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   # 3) Shred the staged plaintext
#   rm /tmp/sp.key.pem
#
# === Verify ===
#
#   kubectl -n cviche-dev get secret cviche-saml-sp-cert -o jsonpath='{.data}' \
#     | python3 -c "import sys, json, base64; d=json.load(sys.stdin); [print(k, base64.b64decode(v)[:30], '...') for k,v in d.items()]"
#
# Expected: sp.crt starts with b'-----BEGIN CERTIFICATE-----' and sp.key with
# b'-----BEGIN PRIVATE KEY-----' (or RSA PRIVATE KEY).
#
# === Cert metadata (for audit) ===
#
#   Subject:     CN=cviche.weill.cornell.edu, OU=CViche, O=Weill Cornell Medicine, L=New York, ST=NY, C=US
#   Validity:    2026-05-20 -> 2029-05-19 (3 years)
#   Fingerprint: 5B:C2:43:CD:76:CC:21:B2:DD:D8:1E:B2:34:44:51:73:F1:AC:3C:DD:65:01:B0:2B:1F:42:0A:A2:B6:B8:1A:47 (sha256)
#   Rotation:    Q1 2029 (.ics reminder filed in Outlook 2026-05-20)
#
# === Reference shape (DO NOT apply this file directly) ===
---
apiVersion: v1
kind: Secret
metadata:
  name: cviche-saml-sp-cert
  namespace: cviche-dev
  labels:
    app: cviche-backend
    component: saml-sp
type: Opaque
data:
  sp.crt: <base64-encoded public certificate (PEM)>   # from ~/cviche-saml-sp-prod.crt.pem
  sp.key: <base64-encoded private key (PEM)>          # from 1Password

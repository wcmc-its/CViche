# Enterprise Directory LDAPS bind credentials for the CViche backend.
# The backend uses these to check group membership (cn=ITS:Library:CViche/user-role
# and /admin-role) at SAML login time, per ed_group_lookup.py.
#
# === Prerequisite ===
#
# This Secret needs a SERVICE ACCOUNT bind DN, not a personal bind. File a
# separate ED service-account request before applying. Paul's personal bind
# (cn=paul albert,ou=binds,...) is for ldapmodify operations only; do NOT
# embed it in pod env.
#
# Expected ED ticket fields:
#   Account name:     svc-cviche
#   Bind DN:          cn=svc-cviche,ou=ServiceAccounts,dc=weill,dc=cornell,dc=edu
#   Scope:            read-only LDAPS bind, search ou=people + ou=groups subtrees
#   Justification:    CViche backend SAML login group lookup
#   Password storage: 1Password ("CViche -- ED service account bind (prod)")
#
# === Apply recipe ===
#
#   # Source the password from 1Password into shell env (do not echo)
#   ED_PW="$(op item get 'CViche -- ED service account bind (prod)' --fields password --reveal)"
#
#   kubectl -n cviche-dev create secret generic cviche-ed-ldap \
#     --from-literal=ED_LDAP_URL='ldaps://ed.weill.cornell.edu:636' \
#     --from-literal=ED_LDAP_BIND_DN='cn=svc-cviche,ou=ServiceAccounts,dc=weill,dc=cornell,dc=edu' \
#     --from-literal=ED_LDAP_BIND_PASSWORD="$ED_PW" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   unset ED_PW
#
# === Verify (without leaking the password) ===
#
#   kubectl -n cviche-dev get secret cviche-ed-ldap \
#     -o jsonpath='{.data}' | python3 -c "import sys, json; print(list(json.load(sys.stdin).keys()))"
#   # Expected: ['ED_LDAP_BIND_DN', 'ED_LDAP_BIND_PASSWORD', 'ED_LDAP_URL']
#
# === Reference shape (DO NOT apply this file directly) ===
---
apiVersion: v1
kind: Secret
metadata:
  name: cviche-ed-ldap
  namespace: cviche-dev
  labels:
    app: cviche-backend
    component: ed-ldap
type: Opaque
stringData:
  ED_LDAP_URL: "ldaps://ed.weill.cornell.edu:636"
  ED_LDAP_BIND_DN: "cn=svc-cviche,ou=ServiceAccounts,dc=weill,dc=cornell,dc=edu"
  ED_LDAP_BIND_PASSWORD: "<from 1Password: CViche -- ED service account bind (prod)>"

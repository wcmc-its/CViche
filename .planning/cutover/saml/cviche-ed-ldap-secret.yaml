# Enterprise Directory LDAPS bind credentials for the CViche backend.
# The backend uses these to check group membership (cn=ITS:Library:CViche/user-role
# and /admin-role) at SAML login time, per ed_group_lookup.py.
#
# === Tactical reuse: cn=reciter,ou=binds,... ===
#
# We're reusing the existing read-only bind that ReCiter-Institutional-Client
# already uses (reciter-inst-secrets/LDAP_BIND_PASSWORD in the reciter ns).
# Verified 2026-05-20 that this bind has read access to both ou=people (for
# mail lookup) and ou=application security (for CViche group membership).
#
# Trade-offs of this choice:
#   + No new ED ticket needed -> cutover unblocked while ITS responds to RITM0791615
#   + Same credential rotation cadence as ReCiter (already managed)
#   - Cross-app coupling: a ReCiter-side rotation breaks CViche, and ED audit
#     logs show "ReCiter" making CViche group queries
#   - Bind lives in ou=binds (personal/admin location) rather than the
#     canonical ou=ServiceAccounts -- predates the WCM ED convention
#
# Long-term followup: file a proper svc-cviche service-account ED ticket
# (cn=svc-cviche,ou=ServiceAccounts,...) and migrate by re-creating this
# Secret with the new credentials and rolling the pod. The migration is a
# pure credential swap -- no code or group-DN changes required.
#
# === Apply recipe ===
#
#   # Source the password from the existing reciter ns secret (no echo)
#   ED_PW="$(kubectl -n reciter get secret reciter-inst-secrets \
#     -o jsonpath='{.data.LDAP_BIND_PASSWORD}' | base64 -d)"
#
#   kubectl -n cviche-dev create secret generic cviche-ed-ldap \
#     --from-literal=ED_LDAP_URL='ldaps://ed.weill.cornell.edu:636' \
#     --from-literal=ED_LDAP_BIND_DN='cn=reciter,ou=binds,dc=weill,dc=cornell,dc=edu' \
#     --from-literal=ED_LDAP_BIND_PASSWORD="$ED_PW" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   unset ED_PW
#
# === Verify (without leaking the password) ===
#
#   kubectl -n cviche-dev get secret cviche-ed-ldap \
#     -o jsonpath='{.data}' | python3 -c "import sys, json; print(list(json.load(sys.stdin).keys()))"
#   # Expected: ['ED_LDAP_BIND_DN', 'ED_LDAP_BIND_PASSWORD', 'ED_LDAP_URL']
#
# === Reference shape (DO NOT apply this file directly) ===
---
apiVersion: v1
kind: Secret
metadata:
  name: cviche-ed-ldap
  namespace: cviche-dev
  labels:
    app: cviche-backend
    component: ed-ldap
type: Opaque
stringData:
  ED_LDAP_URL: "ldaps://ed.weill.cornell.edu:636"
  ED_LDAP_BIND_DN: "cn=reciter,ou=binds,dc=weill,dc=cornell,dc=edu"
  ED_LDAP_BIND_PASSWORD: "<source from reciter ns: kubectl -n reciter get secret reciter-inst-secrets -o jsonpath='{.data.LDAP_BIND_PASSWORD}' | base64 -d>"

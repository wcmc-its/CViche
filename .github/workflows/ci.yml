name: ci

# Build + test gate (the long-deferred #34). deps-audit.yml covers vulnerability
# scanning; this runs the backend test suite and a frontend typecheck/build so a
# broken test or type error is caught before it reaches dev/main.

# Least-privilege default (#684): no job here pushes commits, writes issues/PRs,
# or uploads release assets -- checkout + test/build/scan only -- so repo-wide
# read is enough and no job needs a per-job override.
permissions:
  contents: read

on:
  # Every base branch, not just the trunks: a PR stacked on another feature
  # branch matched nothing here and so reported *no checks at all*, which reads
  # as "not yet run" rather than as a failure (#467). push stays on the trunks
  # so feature-branch pushes don't double-run.
  pull_request:
    branches: ['**']
  push:
    branches: [dev, main]
  workflow_dispatch:

# One run per PR: a newer push cancels the run it supersedes, so a burst of
# pushes to one PR is billed once. Pushes to dev/main and manual runs get a
# group of their own (the run id), so no merge ever cancels another merge's run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # conftest.py uses in-memory SQLite, but app.database builds its engine at
      # import time and the factory raises on incomplete config, so the import
      # needs DB_* set. These are dummies -- no real DB is ever connected.
      DB_HOST: localhost
      DB_PORT: "3306"
      DB_NAME: test
      DB_USER: test
      CVICHE_SESSION_SECRET: test-secret-not-for-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"  # match the build image (python:3.14-slim)
          cache: pip
      # Runtime system libs the app imports at test time (same set the backend
      # Dockerfile installs): xmlsec1 for pysaml2, poppler-utils for PDF parsing.
      - name: Install system deps
        # A stalled Ubuntu mirror hung this step for 15-28 min on five runs
        # (2026-10-07); apt's own timeouts + retries make it fail over instead.
        timeout-minutes: 5
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends xmlsec1 poppler-utils
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt pulls in the backend runtime set (-r requirements.txt)
          # plus pytest/fakeredis; the repo-root requirements.txt adds the pipeline deps.
          pip install -r web_interface/backend/requirements-dev.txt -r requirements.txt
      - name: Run backend tests
        working-directory: web_interface/backend
        run: python -m pytest -q -p no:cacheprovider

  pipeline-tests:
    # The unified_pipeline suite (src/unified_pipeline/tests) is NOT covered by
    # backend-tests, which only runs web_interface/backend/tests. These are the
    # accuracy-critical taxonomy / segmentation / stage-6 regression guards.
    # They are hermetic -- no DB, no AWS, no network -- so they gate cheaply
    # (~325 tests in a few seconds). Same Python/deps setup as backend-tests.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"  # match the build image (python:3.14-slim)
          cache: pip
      - name: Install system deps
        # A stalled Ubuntu mirror hung this step for 15-28 min on five runs
        # (2026-10-07); apt's own timeouts + retries make it fail over instead.
        timeout-minutes: 5
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends xmlsec1 poppler-utils
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r web_interface/backend/requirements-dev.txt -r requirements.txt
      - name: Run pipeline tests
        run: python -m pytest src/unified_pipeline/tests/ -q -p no:cacheprovider
      - name: Render/doctor gate self-test
        run: python3 scripts/test_render_doctor_gates.py
      - name: Render gate integration self-test
        run: python3 scripts/test_render_gate_integration.py
      - name: doctor_vs_autopsy.py self-test
        run: python3 scripts/test_doctor_vs_autopsy.py
      - name: score_vs_autopsy self-tests
        run: python3 scripts/test_score_vs_autopsy.py
      - name: run_corpus_batch.sh self-tests
        # Nothing else in this workflow ran these -- #810's skip-rule fix
        # (a docx alone no longer proves a CV's run is done) needs a shell
        # test that CI actually executes, not just one that exists locally.
        run: |
          for t in scripts/test_run_corpus_batch_*.sh; do
            echo "=== $t ==="
            bash "$t"
          done
      - name: local_ci.sh TRUFFLEHOG resolution self-test
        run: bash scripts/test_local_ci_trufflehog_resolution.sh

  function-size:
    # Ratchet on oversized functions (CODING_STANDARDS.md 3.2a), plus §9's
    # mechanically-checkable rows (CODING_STANDARDS.md 9, check_standards.py).
    # Stdlib plus one wheel: check_standards.py's §7.1/§8.3 rows shell out to
    # ruff (rule set in ruff.toml), and fail closed if it is missing, so it is
    # installed here and nowhere else -- still the cheapest job in this file.
    # The function-size baseline may fall but never rise (a deliberate,
    # reviewed --update); §9's auto block just has to match current dev, in
    # either direction -- it's a snapshot, not a debt budget.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install ruff (pinned -- a version bump changes the counts)
        run: pip install ruff==0.16.6
      - name: Oversized-function ratchet
        run: python3 scripts/check_function_size.py
      - name: Ratchet self-test
        run: python3 scripts/test_check_function_size.py
      - name: CODING_STANDARDS.md §9 auto rows are current
        run: python3 scripts/check_standards.py
      - name: check_standards.py self-test
        run: python3 scripts/test_check_standards.py

  frontend-typecheck:
    # On a PR, the steps after the diff check run only when the PR touches
    # web_interface/frontend/ (which reads nothing outside itself) or this
    # file; pushes to dev/main and manual runs always run them. Skipping steps
    # rather than path-filtering the workflow keeps the job reporting green, so
    # it still works as a required check once branch protection exists (#417):
    # a workflow that never starts leaves a required check pending forever.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web_interface/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # a PR's merge commit plus both parents, for the diff below
      - name: Does this change touch the frontend?
        id: changes
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # HEAD is the PR merged onto its base, so HEAD^1 is the base tip and
          # the diff is exactly what the PR changes. Anything unexpected (not a
          # PR, no parent to diff against) runs the frontend steps.
          if [ "$EVENT_NAME" != "pull_request" ] \
              || ! changed=$(git diff --name-only HEAD^1 HEAD); then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          elif grep -qE '^(web_interface/frontend/|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "No web_interface/frontend/ or ci.yml change: skipping the frontend steps."
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: "20"  # match the build image (node:20-alpine)
          cache: npm
          cache-dependency-path: web_interface/frontend/package-lock.json
      - run: npm ci
        if: steps.changes.outputs.frontend == 'true'
      # Vite does not typecheck on build, so run tsc explicitly, then build to
      # catch anything that breaks the production bundle.
      - run: npx tsc --noEmit
        if: steps.changes.outputs.frontend == 'true'
      - run: npm run build
        if: steps.changes.outputs.frontend == 'true'
      - run: npm test
        if: steps.changes.outputs.frontend == 'true'

  type-check:
    # Opt-in mypy over the modules modernized to typed form (#328). Scope lives
    # in mypy.ini; ignore_missing_imports means no project deps are needed, so
    # this stays fast. Grow mypy.ini's file list as more modules adopt typing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"  # match the build image (python:3.14-slim)
          cache: pip
      - run: python -m pip install --upgrade pip mypy
      - run: mypy --config-file mypy.ini

  secret-scan:
    # Incremental secret scan (#684/#690): fails closed on any credential-shaped
    # match in this PR's/push's own diff range. TruffleHog OSS over gitleaks --
    # gitleaks' official Action needs a paid license for org repos (wcmc-its is
    # one); TruffleHog's Action is free and pinned here by commit SHA, no @main.
    # The scheduled full-history baseline scan lives in deps-audit.yml, not
    # here -- see that file for why.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # TruffleHog needs the base commit to diff against
      # Same pin as deps-audit.yml's secret-scan-full-history job -- bump both
      # together. That job carries the recipe for re-verifying that this SHA is
      # the v3.97.4 tag commit rather than trusting the trailing comment.
      - name: Scan changed commits for secrets
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          version: 3.97.4
          extra_args: --exclude-paths=.trufflehog-exclude.txt

name: deps-audit

# Fail closed if any pinned Python dependency has a known vulnerability.
# This is the repo's first CI workflow (addresses #118; the never-built #34).

# Least-privilege default (#684): every job here is checkout + read-only scan,
# no repo/issue/PR writes, so repo-wide read is enough.
permissions:
  contents: read

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "requirements.txt"
      - "web_interface/backend/requirements.txt"
      - "web_interface/backend/requirements-dev.txt"
      - ".github/workflows/deps-audit.yml"
      - ".pip-audit-ignore.txt"
  push:
    branches: [dev, main]
  workflow_dispatch:
  # Weekly full-history secret-scan baseline (#684). Lives on this workflow's
  # trigger, not ci.yml's: a `schedule:` on ci.yml would also fire its 5
  # build/test jobs weekly for no reason, since none of them scope themselves
  # away from `schedule`. Here, pip-audit picking up a bonus weekly run is a
  # feature, not noise -- it catches a freshly published CVE against deps that
  # haven't otherwise changed since the last push/PR.
  schedule:
    - cron: '17 6 * * 1' # Monday ~06:17 UTC

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14" # match the build image (python:3.14-slim)
      # pip-audit is pinned: an unpinned install lets a security gate
      # change behaviour between runs -- a new release can add, drop or
      # re-classify findings, so the same tree passes one day and fails the
      # next for reasons unrelated to this repo. Bump deliberately; check the
      # current release with `curl -s https://pypi.org/pypi/pip-audit/json |
      # python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])"`.
      # buildspec.yaml pre_build runs the same gate on the deploy path and
      # pins the same version -- keep the two in sync.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pip-audit==2.10.1"

      # SCOPE LIMIT -- read this before trusting a green run.
      # With --no-deps, pip-audit audits exactly the distributions named in the
      # requirements file and does not resolve their dependency trees. These
      # three files list direct dependencies only (12 + 23 + 3 pinned
      # distributions) and the repo has no lockfile, so the transitive set --
      # botocore, httpx, pydantic-core, pyopenssl, certifi, urllib3 and the rest,
      # none of which appear in any requirements file -- is NOT covered by this
      # gate. A vulnerability reachable only through a transitive dependency
      # passes here. Closing that needs a hash-pinned lockfile of the fully
      # resolved set (e.g. pip-compile --generate-hashes), audited instead of
      # these files; until then this gate covers the direct pins and nothing more.
      #
      # --no-deps is kept anyway because dropping it is worse than the gap it
      # leaves: resolving each tree makes pip build and install it, which turns
      # runner-environment problems (missing xmlsec1 for pysaml2, poppler, C
      # toolchain for lxml/cryptography) into red runs on a security gate that
      # then says nothing at all about vulnerabilities.
      #
      # Ignored advisories are maintained in .pip-audit-ignore.txt (tracked in #126).
      # Both this workflow and buildspec.yaml reference that file so the ignore
      # list stays in sync. Remove each entry from that file as #126 lands its fix.
      # New advisories in any dep still fail this gate.
      - name: Audit pinned dependencies for known vulnerabilities
        run: |
          IGNORE_FLAGS=$(grep -v '^#' .pip-audit-ignore.txt | grep -v '^$' | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          for req in \
            requirements.txt \
            web_interface/backend/requirements.txt \
            web_interface/backend/requirements-dev.txt; do
            echo "::group::pip-audit $req"
            pip-audit --no-deps -r "$req" $IGNORE_FLAGS
            echo "::endgroup::"
          done

  secret-scan-full-history:
    # One-time-per-week full-history baseline scan (#684), separate from
    # ci.yml's incremental secret-scan job so push/PR stays cheap (diff-only)
    # while this still catches anything an incremental scan's shallow range
    # could miss (e.g. a history rewrite). Guarded to schedule/dispatch only --
    # it must NOT also run on pull_request/push, which ci.yml's job covers.
    #
    # WHY THIS REALLY IS A HISTORY SCAN, not a working-tree scan. The action has
    # no scan-mode input; its composite step is hardcoded to
    #   docker run ... "${IMAGE}:${VERSION}" git file:///tmp/ \
    #     --since-commit ${BASE:-''} --branch ${HEAD:-''} --fail --no-update ...
    # so the source is always `git` (walks commits) and never `filesystem`. On
    # schedule/workflow_dispatch the action leaves BASE and HEAD empty, so the
    # range is unbounded -- every commit in the clone, not a diff. Verified by
    # running that exact command against a two-commit repo whose only AWS key
    # was added in c1 and `git rm`-ed in c2 (present in history, absent from the
    # working tree): the scan reported the finding and exited 183, i.e. it fails
    # closed. `fetch-depth: 0` below is still required -- it supplies the
    # commits the walk has to see -- but it is not what selects history mode.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history, not just the default shallow clone
      # The SHA pin and the `version:` input below must denote the same release,
      # and the trailing "# v3.97.4" is only a comment -- re-check it rather than
      # trusting it:
      #   gh api repos/trufflesecurity/trufflehog/git/refs/tags/v3.97.4
      #   -> object.sha == 363923b901c911a9164f50b6c423f47c15372b1c  (confirmed)
      # v3.97.4 is also the current latest release
      # (gh api repos/trufflesecurity/trufflehog/releases/latest -> tag_name
      # v3.97.4, published 2026-09-03), so no bump is outstanding as of
      # 2026-09-08. Re-run both calls before changing either line.
      - name: Scan full git history for secrets
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          version: 3.97.4
          extra_args: --exclude-paths=.trufflehog-exclude.txt

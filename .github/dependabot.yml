# Dependabot version updates (issue #130). PRs target `dev` (the integration
# branch, not main). Minor/patch bumps are grouped into one PR per ecosystem to
# avoid PR spam; majors come as individual PRs. The deps-audit.yml gate and
# .pip-audit-ignore.txt still apply to the resulting PRs.
version: 2
updates:
  # Python — pipeline (repo root requirements.txt)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Python — web backend (requirements.txt + requirements-dev.txt)
  - package-ecosystem: pip
    directory: /web_interface/backend
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Frontend (npm, package-lock.json)
  - package-ecosystem: npm
    directory: /web_interface/frontend
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # GitHub Actions used by the CI workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5

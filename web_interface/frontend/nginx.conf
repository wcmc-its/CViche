server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running pipeline operations
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Pass cookies for session auth
        proxy_set_header Cookie $http_cookie;
    }

    # Proxy WebSocket connections to the backend
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout (keep connection alive for pipeline duration)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Pass cookies for session auth on WebSocket upgrade
        proxy_set_header Cookie $http_cookie;
    }

    # Serve static files with caching
    # No add_header here: nginx's inheritance rule means any add_header in
    # this location would REPLACE the server-level security headers below
    # instead of adding to them. `expires 1y;` already emits a matching
    # Cache-Control (max-age=31536000); we lose the `public, immutable`
    # hints, not any caching control (an unauthenticated static asset with
    # an explicit max-age is cacheable by shared caches regardless).
    location /assets/ {
        expires 1y;
    }

    # SPA fallback: serve index.html for all non-file routes
    # This enables React Router client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://$host wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Increase max upload size for CV files
    client_max_body_size 50M;
}

server {
    # TLS terminates at the AWS ALB, never in this pod. k8s/base/ingress.yaml:
    #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    #   alb.ingress.kubernetes.io/ssl-redirect: '443'  -> the ALB 301s :80 to :443
    #   alb.ingress.kubernetes.io/target-type: ip      -> ALB->pod hop is plain HTTP
    # and k8s/overlays/{dev,prod}/ingress-patch.yaml supply the certificate-arn.
    # So do NOT add a `listen 443 ssl` server or an HTTP->HTTPS redirect here:
    # this pod holds no certificate, and the edge already redirects. The browser
    # connection is HTTPS, so the Strict-Transport-Security header added below is
    # passed through by the ALB and is honoured by the browser.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # Proxy API requests to the backend.
    # proxy_pass carries no URI part, so the path is forwarded unchanged and
    # /api/foo reaches the backend as /api/foo. That is required, not an
    # oversight: app/main.py mounts all eight HTTP routers with prefix="/api"
    # (lines 368-375; websocket.router at :376 is the one exception and is
    # served by the separate `location /ws/` block below), and
    # k8s/base/ingress.yaml routes `path: /api` to backend:8000,
    # so the ALB path carries the prefix too. Do not "fix" this to
    # http://backend:8000/ -- the trailing slash strips /api and 404s every
    # API route.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running pipeline operations
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Pass cookies for session auth
        proxy_set_header Cookie $http_cookie;
    }

    # Proxy WebSocket connections to the backend
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout (keep connection alive for pipeline duration)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Pass cookies for session auth on WebSocket upgrade
        proxy_set_header Cookie $http_cookie;
    }

    # Serve static files with caching
    # No add_header here: nginx's inheritance rule means any add_header in
    # this location would REPLACE the server-level security headers below
    # instead of adding to them. `expires 1y;` already emits a matching
    # Cache-Control (max-age=31536000); we lose the `public, immutable`
    # hints, not any caching control (an unauthenticated static asset with
    # an explicit max-age is cacheable by shared caches regardless).
    location /assets/ {
        expires 1y;
    }

    # SPA entry point: never cache. index.html is not content-hashed, so a
    # cached copy keeps pointing at the previous deploy's /assets/ bundles.
    # Long-lived caching stays confined to the hashed assets above. Exact-match
    # locations are tested before prefix ones, so this also catches the
    # try_files internal redirect from the SPA fallback below.
    # No add_header here either, for the same inheritance reason as /assets/:
    # `expires -1;` emits Cache-Control: no-cache on its own.
    location = /index.html {
        expires -1;
    }

    # SPA fallback: serve index.html for all non-file routes
    # This enables React Router client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://directory.weill.cornell.edu; font-src 'self'; connect-src 'self' ws://$host wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Increase max upload size for CV files
    client_max_body_size 50M;
}

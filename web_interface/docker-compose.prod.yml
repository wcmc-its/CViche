# docker-compose.prod.yml -- Production settings
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

services:
  # --- Backend (production) ---
  backend:
    restart: always
    # Production uses an external managed database (RDS); the local "db"
    # service is disabled here, so drop the depends_on inherited from the
    # base file. !reset is required -- a plain value would merge, not replace.
    depends_on: !reset null
    environment:
      # Production overrides (set via .env or deployment pipeline)
      CVICHE_DATABASE_URL: "${CVICHE_DATABASE_URL}"
      CVICHE_SESSION_SECRET: "${CVICHE_SESSION_SECRET}"
      CVICHE_SECURE_COOKIES: "true"
      CVICHE_ALLOWED_ORIGINS: "${CVICHE_ALLOWED_ORIGINS}"
      CVICHE_STORAGE_BACKEND: "s3"
      CVICHE_S3_BUCKET: "${CVICHE_S3_BUCKET}"
      CVICHE_S3_PREFIX: "${CVICHE_S3_PREFIX:-cviche}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    # Drop the dev-only bind mounts (hot-reload of ./backend/app, etc.)
    # and replace with the single production mount: an environment-specific
    # auth_config.yaml. Without !override Compose appends to the base
    # list, leaking the dev mounts into prod.
    #
    # auth_config.yaml is gitignored (it carries allowed users, SAML, and
    # ED group settings) and is NOT baked into the image. config_loader.py
    # falls back to auth_config.yaml.example if the file is absent, which
    # puts the app in a locked-down boot state -- real production must
    # mount a real config. Point CVICHE_AUTH_CONFIG_HOST_PATH at the host
    # path of the provisioned file before running compose up:
    #
    #   export CVICHE_AUTH_CONFIG_HOST_PATH=/etc/cviche/auth_config.yaml
    #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
    #
    # On k8s, ignore this mount and provision auth_config.yaml as a Secret
    # or ConfigMap mounted at the same in-container path
    # (`/app/web_interface/backend/auth_config.yaml`).
    volumes: !override
      - "${CVICHE_AUTH_CONFIG_HOST_PATH:-./backend/auth_config.yaml}:/app/web_interface/backend/auth_config.yaml:ro"
    # Single uvicorn worker: the pipeline-progress WebSocket uses an
    # in-process event emitter, so with multiple workers a client can miss
    # live updates (see issue #4). Scale out with replicas, not workers.
    command: ["--workers", "1"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # --- Frontend (production: nginx serves built assets) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: always
    ports:
      - "80:80"
    # Drop the dev-only hot-reload mounts (./frontend/src etc.). Without
    # !override Compose appends to the base list and the source-tree
    # bind mounts leak into prod -- benign today because nginx serves
    # /usr/share/nginx/html and not /app/src, but still wrong.
    volumes: !override []
    command: ["nginx", "-g", "daemon off;"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # --- DB: use external managed database in production ---
  # Remove the db service -- production uses a managed MariaDB instance
  db:
    profiles:
      - disabled

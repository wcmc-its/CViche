# docker-compose.yml -- Local development
# Usage: docker compose up --build

services:
  # --- MariaDB ---
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: cviche_dev
      MARIADB_DATABASE: cviche
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      # Host port is overridable: a dev box often already has something on 3306.
      - "${CVICHE_DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Redis (real-time event fan-out + cross-worker cancellation) ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Backend (FastAPI) ---
  backend:
    build:
      # Context is the repo root: the image needs src/ and key_files/,
      # which live above web_interface/backend/.
      context: ..
      dockerfile: web_interface/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Database. app/database.py resolves these four keys individually via
      # get_config("db", ...) -- there is no DATABASE_URL code path.
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_USER: "root"
      # alembic/env.py resolves its own MIGRATE_USER, not DB_USER.
      MIGRATE_USER: "root"
      DB_NAME: "cviche"
      # DB_AUTH_MODE selects the credential explicitly; DB_PASSWORD no longer
      # does. It defaults to "iam" (RDS IAM token over certificate-verified
      # TLS), which is what every deployed environment runs and what a stray
      # DB_PASSWORD must never be able to downgrade. "password" is local dev
      # only -- this MariaDB container speaks password auth with no TLS -- and
      # the backend refuses to start in this mode if DB_PASSWORD is empty.
      DB_AUTH_MODE: "password"
      DB_PASSWORD: "cviche_dev"
      # Real-time broker: enables cross-worker events + cancellation. Remove to
      # exercise the in-process (single-worker) fallback path. LOCAL DEV ONLY:
      # unauthenticated plaintext to the compose-local redis. Production uses an
      # authenticated TLS endpoint (rediss://... with a token) injected via the
      # deployment's buildspec-generated ConfigMap/secret, not this value.
      CVICHE_REDIS_URL: "redis://redis:6379/0"
      # Session cookie signing key. No shipped default: known placeholder
      # values hard-fail at boot (app/auth.py), so set it in the host env or
      # a .env file next to this compose file.
      CVICHE_SESSION_SECRET: "${CVICHE_SESSION_SECRET:?generate with python -c 'import secrets; print(secrets.token_hex(32))'}"
      # Cookies: no TLS in local dev
      CVICHE_SECURE_COOKIES: "false"
      # CORS: allow frontend dev server and nginx
      CVICHE_ALLOWED_ORIGINS: "http://localhost:3001,http://localhost:3000,http://localhost:5173,http://localhost:80,http://localhost"
      # Storage: local filesystem for dev
      CVICHE_STORAGE_BACKEND: "local"
    volumes:
      # Hot-reload: mount source code (paths mirror the in-container repo layout)
      - ./backend/app:/app/web_interface/backend/app:ro
      - ./backend/auth_config.yaml:/app/web_interface/backend/auth_config.yaml:ro
      - ./backend/consent_text.md:/app/web_interface/backend/consent_text.md:ro
      # Persist uploads and pipeline outputs across restarts
      - backend_uploads:/app/web_interface/uploads
      - backend_outputs:/app/src/unified_pipeline/outputs
      - backend_prompt_logs:/app/web_interface/backend/prompt_logs
    # Override entrypoint for dev: add --reload flag to uvicorn
    command: ["--reload", "--reload-dir", "/app/web_interface/backend/app"]
    healthcheck:
      # /livez = liveness (process is up). Use /readyz for an LB/orchestrator
      # probe -- it adds DB and S3 reachability checks.
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- Frontend (Vite dev server for hot-reload) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 3001 is CViche's assigned dev port and matches vite.config.ts.
      - "${CVICHE_WEB_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      # In-container the backend is reachable by service name, not localhost.
      VITE_API_TARGET: "http://backend:8000"
    volumes:
      # Hot-reload: mount source code (exclude node_modules)
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:ro
      - ./frontend/postcss.config.js:/app/postcss.config.js:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
    # In dev mode, run Vite dev server instead of nginx (port comes from vite.config.ts)
    command: ["npx", "vite", "--host", "0.0.0.0"]

volumes:
  mariadb_data:
  backend_uploads:
  backend_outputs:
  backend_prompt_logs:

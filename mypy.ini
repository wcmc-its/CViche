[mypy]
# Scoped, opt-in type checking (#328). Only modules that have been modernized to
# built-in generics + TypedDict are listed here; the rest of the codebase is not
# yet annotated, so a repo-wide run would be all noise. Add files as they adopt
# full typing.
files = src/unified_pipeline/segmentation_regression.py,src/unified_pipeline/stage_1b_hierarchy_mapper.py

# The pipeline's stage modules and third-party libs (python-docx, boto3, ...)
# ship no stubs and aren't checked here, so treat their imports as Any rather
# than erroring — this file is verified against its OWN annotations, not theirs.
ignore_missing_imports = True
follow_imports = silent

warn_redundant_casts = True
warn_unused_ignores = True

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base  # Point to the FOLDER, not the files inside it

namespace: cviche-dev

# 2. Cviche authentication config map configuration right below it!
configMapGenerator:
  - name: cviche-auth-config
    files:
      - auth_config.yaml
  # Pipeline-behaviour flags shared by BOTH drivers (the backend's
  # in-process path and the worker's queue path) -- one source so the two
  # container envs cannot drift apart the way CVICHE_BLOCK_COHERENCE_REPAIR
  # did (#701 rework, mrj4001 review point 4070646335#1). Add any new flag
  # literal here; never duplicate one directly in backend-patch.yaml or
  # worker-patch.yaml. Both patches consume this via envFrom.configMapRef.
  - name: cviche-pipeline-flags
    literals:
      # Dev-first rollout of the #198 block-coherence repair (off by
      # default in code). Replays passed: fixes misrouted mentees/staff,
      # zero subject-own rows touched. Watch the "10c." log line + Bedrock
      # cost here before enabling in prod.
      - CVICHE_BLOCK_COHERENCE_REPAIR=1

# 1. Your existing database secrets configuration
secretGenerator:
  - name: cviche-secrets
    envs:
      - db.env
    literals:
      - ED_LDAP_BIND_PASSWORD=CODEBUILD_ED_LDAP_BIND_PASSWORD

  - name: cviche-saml-certs
    files:
      - saml.key=cviche-saml-sp-prod.key.pem
      - saml.crt=cviche-saml-sp-prod.crt.pem          

patches:
  - path: backend-patch.yaml
  - path: frontend-patch.yaml
  - path: worker-patch.yaml
  - path: worker-flex-patch.yaml
  - path: sa-patch.yaml
  - path: ingress-patch.yaml
  - path: hpa-patch.yaml

patchesJson6902:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: cviche-ingress
      # Note: We can omit the namespace filter here because Kustomize 
      # runs this JSON patch within the scope of the file's defined target name.
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: cviche.weill.cornell.edu
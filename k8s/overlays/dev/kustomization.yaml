apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pointing directly to the files since base has no index
resources:
 - ../../base  # Point to the FOLDER, not the files inside it

namespace: cviche-dev

             
secretGenerator:
  - name: cviche-secrets
    type: Opaque
    literals:
      - CVICHE_SESSION_SECRET=CVICHE_SESSION_SECRET_PLACEHOLDER
      - CVICHE_DATABASE_URL='CVICHE_DB_URL_PLACEHOLDER'
      
      
patches:
  - path: backend-patch.yaml
  - path: frontend-patch.yaml
  - path: sa-patch.yaml
  - path: ingress-patch.yaml
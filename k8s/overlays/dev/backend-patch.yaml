apiVersion: apps/v1
kind: Deployment
metadata:
  name: cviche-backend
spec:
  template:
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: cviche-al2023-nodes
      # --- Give the one-shot db-migration init container the same DB config the
      #     main container gets: the cviche-secrets env + the auth_config.yaml file
      #     (which carries DB_HOST/DB_PORT/DB_NAME/DB_USER). Without this the
      #     migration engine factory resolves empty config and aborts the rollout
      #     (Init:CrashLoopBackOff). MIGRATION_USER from base/deployments.yaml is
      #     preserved by the strategic-merge (matched on the container name).
      initContainers:
        - name: db-migration # Must match the name in base/deployments.yaml
          envFrom:
            - secretRef:
                name: cviche-secrets
          volumeMounts:
            - name: auth-config-volume
              mountPath: /app/web_interface/backend/auth_config.yaml
              subPath: auth_config.yaml # Same single-file mount the backend container uses
      containers:
        - name: backend # Must match the name in base/deployment.yaml
          resources:
            requests:
              # Was 300m. Lowered so 6 workers plus a rolling-update surge fit
              # the 2-node cviche node group (max size 2): the backend no longer runs pipelines in queue mode and uses 6-8m
              # (kubectl top, 2026-10-01). Limits unchanged.
              cpu: "150m"
              memory: "512Mi"
            # Burstable: limits raised to 2 vCPU / 2Gi so a pod can absorb 3
            # concurrent runs (CVICHE_MAX_CONCURRENT_RUNS below). Requests kept
            # modest so scheduling/footprint is unchanged (nodegroup headroom is
            # tracked separately in #82); for prod-identical guaranteed QoS, raise
            # requests to match limits once the nodegroup is sized for it.
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            # Stopgap: dev defaulted to 2 (the per-pod cap is sized to memory),
            # so the 3rd concurrent run got the "at capacity" 429. Bump to 3 to
            # match prod now that the memory limit is 2Gi. The real fix for the
            # ceiling is the pub/sub->Streams + worker migration.
            - name: CVICHE_MAX_CONCURRENT_RUNS
              value: "3"
            # Runs go to the Valkey queue and execute on cviche-worker pods
            # (#701). CVICHE_MAX_CONCURRENT_RUNS only applies in in_process
            # mode; rollback is deleting this entry.
            - name: CVICHE_DISPATCH_MODE
              value: "queue"
          # CVICHE_BLOCK_COHERENCE_REPAIR (and any other pipeline-behaviour
          # flag shared with the worker) comes from the cviche-pipeline-flags
          # ConfigMap below, not a literal env entry here -- see its comment
          # in kustomization.yaml (#701 rework, mrj4001 review 4070646335#1).
          envFrom:
            - configMapRef:
                name: cviche-pipeline-flags
            - secretRef:
                name: cviche-secrets
          # --- New Volume Mount for Auth Config ---
          volumeMounts:
            - name: auth-config-volume
              mountPath: /app/web_interface/backend/auth_config.yaml
              subPath: auth_config.yaml # Mounts ONLY this file without wiping out existing app files

          # --- Map SAML Private Key ---
            - name: certs-volume
              mountPath: /app/web_interface/backend/certs/sp.key
              subPath: saml.key
            # --- Map SAML Public Certificate ---
            - name: certs-volume
              mountPath: /app/web_interface/backend/certs/sp.crt
              subPath: saml.crt    
      # --- New Volume Definition ---
      volumes:
        - name: auth-config-volume
          configMap:
            name: cviche-auth-config # Automatically links with your configMapGenerator
        # --- Declare the Shared Secret Volume ---
        - name: certs-volume
          secret:
            secretName: cviche-saml-certs    
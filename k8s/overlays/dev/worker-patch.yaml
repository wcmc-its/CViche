apiVersion: apps/v1
kind: Deployment
metadata:
  name: cviche-worker
spec:
  replicas: 1
  template:
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: cviche-al2023-nodes
      containers:
        - name: worker # Must match the name in base/worker/deployment.yaml
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            # Dev-first rollout of the #198 block-coherence repair — the worker
            # must run the same pipeline-behaviour flags as the backend, or the
            # queue path silently diverges from the in-process path.
            - name: CVICHE_BLOCK_COHERENCE_REPAIR
              value: "1"
          envFrom:
            - secretRef:
                name: cviche-secrets
          volumeMounts:
            - name: auth-config-volume
              mountPath: /app/web_interface/backend/auth_config.yaml
              subPath: auth_config.yaml # Mounts ONLY this file without wiping out existing app files
      volumes:
        - name: auth-config-volume
          configMap:
            name: cviche-auth-config # Automatically links with your configMapGenerator

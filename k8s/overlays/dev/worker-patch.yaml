apiVersion: apps/v1
kind: Deployment
metadata:
  name: cviche-worker
spec:
  replicas: 1 # global run cap for dev -- one run per pod, no HPA (see base/worker/deployment.yaml)
  template:
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: cviche-al2023-nodes
      containers:
        - name: worker # Must match the name in base/worker/deployment.yaml
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            # Burstable on purpose, mirroring the dev backend's sizing for
            # nodegroup density (#82, OPEN). The limit is generous because a
            # worker runs exactly one pipeline at a time (unlike the
            # backend's 3-concurrent-run headroom) -- there's no single-run
            # memory measurement yet to justify a different number. Requests
            # get raised to match the limit (Guaranteed QoS, like prod
            # below) once #82 resizes the nodegroup.
            limits:
              cpu: "2"
              memory: "2Gi"
          # Pipeline-behaviour flags (CVICHE_BLOCK_COHERENCE_REPAIR etc.) come
          # from the cviche-pipeline-flags ConfigMap via envFrom below, the
          # same source the backend patch uses -- the worker must run the
          # same flags as the backend, or the queue path silently diverges
          # from the in-process path (#701 rework, mrj4001 review
          # 4070646335#1).
          envFrom:
            - configMapRef:
                name: cviche-pipeline-flags
            - secretRef:
                name: cviche-secrets
          volumeMounts:
            - name: auth-config-volume
              mountPath: /app/web_interface/backend/auth_config.yaml
              subPath: auth_config.yaml # Mounts ONLY this file without wiping out existing app files
              # Required despite the name: app.database reads the db section
              # at import time, and worker.main() reads the redis + s3
              # sections (it exits 2 without them). SAML certs are NOT
              # mounted here -- that's certs-volume on the backend patch only
              # (#701 rework, mrj4001 review 4070646335#2).
      volumes:
        - name: auth-config-volume
          configMap:
            name: cviche-auth-config # Automatically links with your configMapGenerator

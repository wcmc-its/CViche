apiVersion: apps/v1
kind: Deployment
metadata:
  name: cviche-backend
spec:
  template:
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: cviche-al2023-nodes
      # --- Give the one-shot db-migration init container the same DB config the
      #     main container gets: the cviche-secrets env + the auth_config.yaml file
      #     (which carries DB_HOST/DB_PORT/DB_NAME/DB_USER). Without this the
      #     migration engine factory resolves empty config and aborts the rollout
      #     (Init:CrashLoopBackOff). The auth-config-volume is already declared at
      #     the pod level below.
      initContainers:
        - name: db-migration # Must match the name in base/deployments.yaml
          envFrom:
            - secretRef:
                name: cviche-secrets
          volumeMounts:
            - name: auth-config-volume
              mountPath: /app/web_interface/backend/auth_config.yaml
              subPath: auth_config.yaml # Same single-file mount the backend container uses
      containers:
        - name: backend # Must match the name in base/deployment.yaml
          resources:
            requests:
              cpu: "2"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: CVICHE_MAX_CONCURRENT_RUNS
              value: "3"
            # S3 is the only prod storage backend (#109). An env var outranks
            # auth_config.yaml's s3 section (config_loader.get_config), so an
            # unset or wrong CodeBuild CVICHE_STORAGE_BACKEND can no longer put
            # uploads on the pod filesystem, where a rollout loses them. With
            # s3 pinned, an unset CVICHE_S3_BUCKET fails /readyz instead.
            - name: CVICHE_STORAGE_BACKEND
              value: "s3"
          envFrom:
            - secretRef:
                name: cviche-secrets
          # --- New Volume Mount for Auth Config ---
          volumeMounts:
            - name: auth-config-volume
              mountPath: /app/web_interface/backend/auth_config.yaml
              subPath: auth_config.yaml # Mounts ONLY this file without wiping out existing app files

          # --- Map SAML Private Key ---
            - name: certs-volume
              mountPath: /app/web_interface/backend/certs/sp.key
              subPath: saml.key
            # --- Map SAML Public Certificate ---
            - name: certs-volume
              mountPath: /app/web_interface/backend/certs/sp.crt
              subPath: saml.crt    
      # --- New Volume Definition ---
      volumes:
        - name: auth-config-volume
          configMap:
            name: cviche-auth-config # Automatically links with your configMapGenerator
        # --- Declare the Shared Secret Volume ---
        - name: certs-volume
          secret:
            secretName: cviche-saml-certs    
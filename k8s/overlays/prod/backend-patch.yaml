apiVersion: apps/v1
kind: Deployment
metadata:
  name: cviche-backend
spec:
  # Baseline replica count for the prod backend. The HorizontalPodAutoscaler
  # (k8s/overlays/prod/backend-hpa.yaml) governs scale-out from here up to
  # maxReplicas. Going >1 requires CVICHE_REDIS_URL to be set in the
  # cviche-secrets Secret so the event broker and cancellation signal cross
  # pod boundaries; otherwise the live progress viewer breaks for any user
  # whose WebSocket lands on a different pod than their run.
  replicas: 2
  template:
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: cviche-al2023-nodes
      containers:
        - name: backend # Must match the name in base/deployment.yaml
          resources:
            requests:
              cpu: "2"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: CVICHE_MAX_CONCURRENT_RUNS
              value: "3"
          envFrom:
            - secretRef:
                name: cviche-secrets
          # --- New Volume Mount for Auth Config ---
          volumeMounts:
            - name: auth-config-volume
              mountPath: /app/web_interface/backend/auth_config.yaml
              subPath: auth_config.yaml # Mounts ONLY this file without wiping out existing app files

          # --- Map SAML Private Key ---
            - name: certs-volume
              mountPath: /app/web_interface/backend/certs/sp.key
              subPath: saml.key
            # --- Map SAML Public Certificate ---
            - name: certs-volume
              mountPath: /app/web_interface/backend/certs/sp.crt
              subPath: saml.crt    
      # --- New Volume Definition ---
      volumes:
        - name: auth-config-volume
          configMap:
            name: cviche-auth-config # Automatically links with your configMapGenerator
        # --- Declare the Shared Secret Volume ---
        - name: certs-volume
          secret:
            secretName: cviche-saml-certs    
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cviche-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cviche-backend
  template:
    metadata:
      labels:
        app: cviche-backend
    spec:
      # Reuses your single IRSA setup to authenticate both database users via IAM
      serviceAccountName: cviche-sa 
      
      # 1. The One-Shot Pre-Deployment Migration Step
      initContainers:
        - name: db-migration
          image: backend # Dynamically updated by Kustomize via CodeBuild
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "docker-entrypoint.sh"]
          args: ["migrate"] # ◄ Triggers the migration logic inside your entrypoint script
          env:
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: cviche-auth-config # Your existing ConfigMap
                  key: auth_config.yaml
                  jsonPath: $.db.MIGRATE_DB_USER # ◄ Dynamically extracts your migration user string

      # 2. The Main Runtime Web Application Step
      containers:
        - name: backend
          image: backend
                                                                             
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: CVICHE_RUN_MIGRATIONS
              value: "0" # ◄ Tells the app container to skip migrations on boot
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: cviche-auth-config
                  key: auth_config.yaml
                  jsonPath: $.db.APP_DB_USER # ◄ Dynamically extracts your web app user string
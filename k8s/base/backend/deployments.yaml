apiVersion: apps/v1
kind: Deployment
metadata:
  name: cviche-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cviche-backend
  template:
    metadata:
      labels:
        app: cviche-backend
    spec:
      serviceAccountName: cviche-sa 
      containers:
      - name: backend
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_DEFAULT_REGION>.amazonaws.com/wcmc/cviche/backend:dev-latest
        # imagePullPolicy and env now correctly align with 'name' and 'ports'
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cviche-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cviche-backend
  template:
    metadata:
      labels:
        app: cviche-backend
    spec:
      # Drain on deploy (#116): a run executes inside the backend process, so a
      # pod stopped mid-run used to leave that run "running" forever. On SIGTERM
      # the app stops admitting runs, waits up to CVICHE_SHUTDOWN_DRAIN_SECONDS
      # (default 1500) for in-flight ones, then marks the rest failed. Grace =
      # 15s preStop + 10s uvicorn --timeout-graceful-shutdown + 1500s drain +
      # 35s to write the failures and exit. Raise it if the drain budget grows.
      terminationGracePeriodSeconds: 1560
      # Reuses your single IRSA setup to authenticate both database users via IAM
      serviceAccountName: cviche-sa 
      
      # 1. The One-Shot Pre-Deployment Migration Step
      initContainers:
        - name: db-migration
          image: backend # Dynamically updated by Kustomize via CodeBuild
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "docker-entrypoint.sh"]
          args: ["migrate"] # ◄ Triggers the migration logic inside your entrypoint script

      # 2. The Main Runtime Web Application Step
      containers:
        - name: backend
          image: backend
                                                                             
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # Keep serving for 15s after the pod is marked terminating so the ALB
          # (target-type ip) deregisters it before uvicorn stops accepting;
          # SIGTERM, and with it the run drain, follows this sleep.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
          env:
            - name: PORT
              value: "8000"
            - name: CVICHE_RUN_MIGRATIONS
              value: "0" # ◄ Tells the app container to skip migrations on boot
            - name: CVICHE_INIT_DB
              value: "0" # ◄ Alembic owns schema; no metadata.create_all() DDL at boot (#191)
          # Probes: the app serves /livez and /readyz at the root. The startupProbe
          # gives a slow boot up to 30*10s=300s before the livenessProbe takes over,
          # so a cold start is never killed prematurely.
          startupProbe:
            httpGet:
              path: /livez
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            # /readyz does a DB SELECT 1 plus an S3 head_bucket whose own
            # client timeout is ~2s. The probe default timeoutSeconds is 1s,
            # so a transient DB/S3 hiccup would trip the 1s deadline and flap
            # every replica out of the LB at once. Give the probe more budget
            # than the handler's own dependency timeouts.
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            periodSeconds: 15
          # The backend image already runs as non-root UID 1000 (USER cviche in the
          # Dockerfile). readOnlyRootFilesystem is intentionally NOT set: the app
          # writes uploads and prompt_logs to the container filesystem.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
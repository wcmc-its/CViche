---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cviche-frontend
  labels:
    app: cviche-frontend
    environment: dev
    owner: mrj4001
    tier: frontend      
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cviche-frontend
      tier: frontend      
  strategy:
    rollingUpdate:
      maxUnavailable: 0                
  template:
    metadata:
      labels:
        app: cviche-frontend
        environment: dev
        tier: frontend
        owner: mrj4001              
    spec:
      containers:
      - name: frontend
        image: frontend
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        readinessProbe:
          httpGet:
            path: /
            port: 8080
        livenessProbe:
          httpGet:
            path: /
            port: 8080
        # nginx runs as the image's nginx user (uid 101) on 8080; the Dockerfile
        # moves its pid file, and nginx.conf its temp paths, to /tmp, the one
        # writable path (#109).
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}

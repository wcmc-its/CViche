# Lint gate for CODING_STANDARDS.md §8.3 item 1 (modern 3.14 typing syntax,
# annotations), §7.1 (no print() in library code) and §5.4 (no blind
# `except Exception`). Counts are ratcheted
# by scripts/check_standards.py against scripts/standards-baseline.json --
# they may fall, never rise -- so this file is the one definition of WHAT is
# counted; the script only sums it. Phase 2 landed (#533): the typing-syntax
# row (UP*, RUF013) is at a baseline of 0, and a ratchet at 0 is a hard zero --
# one new hit fails check_standards.py.
#
# Not selected on purpose: RUF100 (unused-noqa) strips `# noqa` comments that
# carry a human justification (stage_6_word_template.py, run_doctor.py, ...).
target-version = "py314"
# extend-, not exclude=: a bare `exclude` REPLACES ruff's default list, which
# is what keeps .venv/, .git/ and __pycache__/ out of the count.
extend-exclude = [
    "archive",
    "node_modules",
    "web_interface/backend/alembic/versions",
]

[lint]
select = [
    "UP006",   # list[...] not typing.List[...]
    "UP007",   # X | Y not typing.Union[X, Y]
    "UP035",   # deprecated typing imports (List, Dict, Optional, ...)
    "UP045",   # X | None not typing.Optional[X]
    "UP037",   # no quoted annotations
    "ANN001",  # argument annotation
    "ANN201",  # return annotation, public function
    "ANN202",  # return annotation, private function
    "ANN204",  # return annotation, special method
    "ANN401",  # no `Any` in an annotation
    "RUF012",  # mutable class attribute needs ClassVar
    "RUF013",  # implicit Optional (`x: int = None`)
    "T201",    # print()
    "BLE001",  # blind `except Exception` (§5.4)
]

[lint.per-file-ignores]
"*/tests/*" = ["ANN", "T201", "BLE001"]
"scripts/*" = ["ANN", "T201"]
"src/unified_pipeline/tests/*" = ["ANN", "T201"]

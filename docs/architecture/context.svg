" height="18" rx="9" fill="#ffffff" stroke="#f08c00" stroke-opacity="0.45"/><text x="780" y="469.79999999999995" font-size="10" fill="#3a434f" text-anchor="middle">artifacts</text><g><rect x="36" y="97" width="51" height="26" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/><text x="61.5" y="114.5" font-size="12" font-weight="700" fill="#343a40" text-anchor="middle">Users</text></g><g><rect x="346" y="97" width="57.599999999999994" height="26" rx="8" fill="#ffffff" stroke="#0ca678" stroke-width="1.2"/><text x="374.8" y="114.5" font-size="12" font-weight="700" fill="#0b6e4f" text-anchor="middle">CViche</text></g><g><rect x="826" y="97" width="176.39999999999998" height="26" rx="8" fill="#ffffff" stroke="#f08c00" stroke-width="1.2"/><text x="914.2" y="114.5" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">Data &amp; external services</text></g><g><title>CLI user — run_full_pipeline.py; batch / single CV</title><rect x="40" y="150" width="240" height="86" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6" filter="url(#sh)"/><rect x="52" y="165" width="9" height="9" rx="2.5" fill="#868e96"/><text x="68" y="174" font-size="13.5" font-weight="700" fill="#343a40">CLI user</text><text x="54" y="191" font-size="11" fill="#5b6470">run_full_pipeline.py</text><text x="54" y="206" font-size="11" fill="#5b6470">batch / single CV</text></g><g><title>Web user — uploads .docx / .pdf; SAML or email login; live progress (WebSocket)</title><rect x="40" y="300" width="240" height="100" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6" filter="url(#sh)"/><rect x="52" y="315" width="9" height="9" rx="2.5" fill="#868e96"/><text x="68" y="324" font-size="13.5" font-weight="700" fill="#343a40">Web user</text><text x="54" y="341" font-size="11" fill="#5b6470">uploads .docx / .pdf</text><text x="54" y="356" font-size="11" fill="#5b6470">SAML or email login</text><text x="54" y="371" font-size="11" fill="#5b6470">live progress (WebSocket)</text></g><g><title>React 18 SPA — Vite · Tailwind · React Router; upload · progress · admin</title><rect x="360" y="150" width="360" height="86" rx="10" fill="#e7ecff" stroke="#4263eb" stroke-width="1.6" filter="url(#sh)"/><rect x="372" y="165" width="9" height="9" rx="2.5" fill="#4263eb"/><text x="388" y="174" font-size="13.5" font-weight="700" fill="#2b3a8c">React 18 SPA</text><text x="374" y="191" font-size="11" fill="#5b6470">Vite · Tailwind · React Router</text><text x="374" y="206" font-size="11" fill="#5b6470">upload · progress · admin</text></g><g><title>FastAPI backend — REST /api · WebSocket /ws; runs · steps · auth · admin</title><rect x="360" y="280" width="360" height="90" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="372" y="295" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="388" y="304" font-size="13.5" font-weight="700" fill="#0b6e4f">FastAPI backend</text><text x="374" y="321" font-size="11" fill="#5b6470">REST /api · WebSocket /ws</text><text x="374" y="336" font-size="11" fill="#5b6470">runs · steps · auth · admin</text></g><g><title>12-stage CV pipeline — src/unified_pipeline · orchestrator</title><rect x="360" y="414" width="360" height="82" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="372" y="429" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="388" y="438" font-size="13.5" font-weight="700" fill="#0b6e4f">12-stage CV pipeline</text><text x="374" y="455" font-size="11" fill="#5b6470">src/unified_pipeline · orchestrator</text></g><g><title>Run database — MariaDB (prod) / SQLite (dev)</title><rect x="840" y="150" width="350" height="64" rx="10" fill="#fff4d6" stroke="#f08c00" stroke-width="1.6" filter="url(#sh)"/><rect x="852" y="165" width="9" height="9" rx="2.5" fill="#f08c00"/><text x="868" y="174" font-size="13.5" font-weight="700" fill="#8a5a00">Run database</text><text x="854" y="191" font-size="11" fill="#5b6470">MariaDB (prod) / SQLite (dev)</text></g><g><title>LLM provider — AWS Bedrock (Claude) — default; OpenAI — alternative</title><rect x="840" y="236" width="350" height="78" rx="10" fill="#f0ebff" stroke="#7048e8" stroke-width="1.6" filter="url(#sh)"/><rect x="852" y="251" width="9" height="9" rx="2.5" fill="#7048e8"/><text x="868" y="260" font-size="13.5" font-weight="700" fill="#4a2fb0">LLM provider</text><text x="854" y="277" font-size="11" fill="#5b6470">AWS Bedrock (Claude) — default</text><text x="854" y="292" font-size="11" fill="#5b6470">OpenAI — alternative</text></g><g><title>NCBI PubMed — E-utilities — publication metadata</title><rect x="840" y="336" width="350" height="58" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6" filter="url(#sh)"/><rect x="852" y="351" width="9" height="9" rx="2.5" fill="#868e96"/><text x="868" y="360" font-size="13.5" font-weight="700" fill="#343a40">NCBI PubMed</text><text x="854" y="377" font-size="11" fill="#5b6470">E-utilities — publication metadata</text></g><g><title>Object storage — S3 (prod) / local disk (dev)</title><rect x="840" y="416" width="350" height="58" rx="10" fill="#fff4d6" stroke="#f08c00" stroke-width="1.6" filter="url(#sh)"/><rect x="852" y="431" width="9" height="9" rx="2.5" fill="#f08c00"/><text x="868" y="440" font-size="13.5" font-weight="700" fill="#8a5a00">Object storage</text><text x="854" y="457" font-size="11" fill="#5b6470">S3 (prod) / local disk (dev)</text></g></svg>
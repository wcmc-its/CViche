<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 580" width="1240" height="580" role="img" aria-labelledby="t-context d-context" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="t-context">System context</title><desc id="d-context">CViche standardizes academic CVs into the Weill Cornell Medicine format. Two entry points drive the same 12-stage pipeline: a CLI for batch runs and a React + FastAPI web app for interactive use. The pipeline calls an LLM provider (AWS Bedrock by default, OpenAI as an alternative) for ten of its twelve stages, enriches publications via PubMed, and persists runs and artifacts to a database and object store.</desc><rect width="100%" height="100%" fill="#fbfcfe"/><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="2.4" flood-color="#0b1f3a" flood-opacity="0.14"/></filter><marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#868e96"/></marker><marker id="mMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7d1c1c"/></marker><marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#e03131"/></marker><marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#2f9e44"/></marker><marker id="mIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#4263eb"/></marker><marker id="mViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7048e8"/></marker><marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#f08c00"/></marker><marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#0ca678"/></marker></defs><rect x="20" y="110" width="290" height="320" rx="14" fill="#f1f3f5" fill-opacity="0.16" stroke="#adb5bd" stroke-width="1.4"><title>Users</title></rect><rect x="330" y="110" width="420" height="430" rx="14" fill="#e3faf3" fill-opacity="0.16" stroke="#0ca678" stroke-width="1.4"><title>CViche</title></rect><rect x="810" y="110" width="400" height="384" rx="14" fill="#fff4d6" fill-opacity="0.16" stroke="#f08c00" stroke-width="1.4"><title>Data &amp; external services</title></rect><path d="M280,350 C337.32057166497907,350 302.67942833502093,201.6 360,201.6" fill="none" stroke="#4263eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mIndigo)"/><path d="M540,236 C540,272 540,244 540,280" fill="none" stroke="#4263eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mIndigo)"/><path d="M540,370 C540,406 540,378 540,414" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGreen)"/><path d="M280,193 L320,193 L320,443 L360,442.7" fill="none" stroke="#868e96" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#mGray)"/><path d="M720,307 C778.9142597339558,307 781.0857402660442,182 840,182" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M720,430.4 C786.7553960066151,430.4 773.2446039933849,275 840,275" fill="non
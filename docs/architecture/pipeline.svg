<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1710 660" width="1710" height="660" role="img" aria-labelledby="t-pipeline d-pipeline" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="t-pipeline">The 12-stage CV pipeline</title><desc id="d-pipeline">Each stage produces JSON the next stage consumes, grouped into six phases. Ten of the twelve stages call an LLM (AWS Bedrock Claude — Sonnet 4.6 by default; stage 3b runs the cheaper, gold-eval-preferred Haiku 4.5). The two exceptions: 1b (header→index mapping) is deterministic, and 5 (PubMed enrichment) calls an external API. Stage 6's headline job is rendering the WCM Word document — the pipeline's primary output — but it also calls the LLM to classify the geographic scope of presentations and service.</desc><rect width="100%" height="100%" fill="#fbfcfe"/><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="2.4" flood-color="#0b1f3a" flood-opacity="0.14"/></filter><marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#868e96"/></marker><marker id="mMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7d1c1c"/></marker><marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#e03131"/></marker><marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#2f9e44"/></marker><marker id="mIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" 
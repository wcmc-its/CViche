<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 560" width="1360" height="560" role="img" aria-labelledby="t-runtime d-runtime" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="t-runtime">Web app &amp; run lifecycle</title><desc id="d-runtime">The browser uploads a CV (creating a run + 12 step rows), then starts it. Start passes a per-pod admission gate (CVICHE_MAX_CONCURRENT_RUNS; full → HTTP 429) and schedules an in-process asyncio background task that runs the orchestrator — the API returns immediately. Progress reaches the browser two ways: it polls status every 2 s and subscribes to a WebSocket fed by step events (a Redis broker carries them across pods when replicas &gt; 1). When the run finishes, the browser downloads the WCM document.</desc><rect width="100%" height="100%" fill="#fbfcfe"/><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="2.4" flood-color="#0b1f3a" flood-opacity="0.14"/></filter><marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#868e96"/></marker><marker id="mMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7d1c1c"/></marker><marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#e03131"/></marker><marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#2f9e44"/></marker><marker id="mIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#4263eb"/></marker><marker id="mViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7048e8"/></marker><marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#f08c00"/></marker><marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#0ca678"/></marker></defs><rect x="284" y="96" width="282" height="380" rx="14" fill="#e3faf3" fill-opacity="0.16" stroke="#0ca678" stroke-width="1.4"><title>FastAPI endpoints</title></rect><rect x="594" y="188" width="556" height="150" rx="14" fill="#e3faf3" fill-opacity="0.16" stroke="#0ca678" stroke-width="1.4"><title>Background asyncio task</title></rect><path d="M250,219.2 C286,219.2 264,157 300,157" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGreen)"/><path d="M250,264.8 C286,264.8 264,246 300,246" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGreen)"/><path d="M250,310.4 C286,310.4 264,335 300,335" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGreen)"/><path d="M250,356 C286,356 264,423 300,423" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGreen)"/><path d="M550,157 L588,157 L1150,157 L1180,175.2" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M550,246 C586,246 574,266 610,266" fill="none" stroke="#4263eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mIndigo)"/><path d="M850,266 C886,266 864,266 900,266" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGreen)"/><path d="M1140,218 C1176,218 1144,217.2 1180,217.2" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M1140,302 C1176,302 1144,304 1180,304" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M948,326 C948,377.7202474858735 814,346.2797525141265 814,398" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mViolet)"/><path d="M550,335 L588,335 L588,170 L1150,170 L1180,208.8" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M550,423 L582,423 L582,366 L1150,366 L1180,344.5" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M610,444 L560,516 L150,516 L166,375" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#mViolet)"/><rect x="245.6" y="178.6" width="58.8" height="18" rx="9" fill="#ffffff" stroke="#2f9e44" stroke-opacity="0.45"/><text x="275" y="191.5" font-size="10" fill="#3a434f" text-anchor="middle">① upload</text><rect x="248.525" y="245.9" width="52.949999999999996" height="18" rx="9" fill="#ffffff" stroke="#2f9e44" stroke-opacity="0.45"/><text x="275" y="258.8" font-size="10" fill="#3a434f" text-anchor="middle">② start</text><rect x="236.825" y="313.2" width="76.35" height="18" rx="9" fill="#ffffff" stroke="#2f9e44" stroke-opacity="0.45"/><text x="275" y="326.09999999999997" font-size="10" fill="#3a434f" text-anchor="middle">③ poll · 2s</text><rect x="239.75" y="380" width="70.5" height="18" rx="9" fill="#ffffff" stroke="#2f9e44" stroke-opacity="0.45"/><text x="275" y="392.9" font-size="10" fill="#3a434f" text-anchor="middle">④ download</text><rect x="520.575" y="147.5" width="134.85" height="18" rx="9" fill="#ffffff" stroke="#f08c00" stroke-opacity="0.45"/><text x="588" y="160.4" font-size="10" fill="#3a434f" text-anchor="middle">create run + 12 steps</text><rect x="538.9" y="246.5" width="82.19999999999999" height="18" rx="9" fill="#ffffff" stroke="#4263eb" stroke-opacity="0.45"/><text x="580" y="259.4" font-size="10" fill="#3a434f" text-anchor="middle">acquire slot</text><rect x="842.675" y="256.5" width="64.65" height="18" rx="9" fill="#ffffff" stroke="#2f9e44" stroke-opacity="0.45"/><text x="875" y="269.4" font-size="10" fill="#3a434f" text-anchor="middle">execute()</text><rect x="1124.75" y="208.1" width="70.5" height="18" rx="9" fill="#ffffff" stroke="#f08c00" stroke-opacity="0.45"/><text x="1160" y="221" font-size="10" fill="#3a434f" text-anchor="middle">step state</text><rect x="1127.675" y="293.5" width="64.65" height="18" rx="9" fill="#ffffff" stroke="#f08c00" stroke-opacity="0.45"/><text x="1160" y="306.4" font-size="10" fill="#3a434f" text-anchor="middle">artifacts</text><rect x="842.825" y="352.5" width="76.35" height="18" rx="9" fill="#ffffff" stroke="#7048e8" stroke-opacity="0.45"/><text x="881" y="365.4" font-size="10" fill="#3a434f" text-anchor="middle">step events</text><rect x="552.75" y="160.5" width="70.5" height="18" rx="9" fill="#ffffff" stroke="#f08c00" stroke-opacity="0.45"/><text x="588" y="173.4" font-size="10" fill="#3a434f" text-anchor="middle">read state</text><rect x="537.975" y="356.5" width="88.05" height="18" rx="9" fill="#ffffff" stroke="#f08c00" stroke-opacity="0.45"/><text x="582" y="369.4" font-size="10" fill="#3a434f" text-anchor="middle">presigned URL</text><rect x="515.975" y="506.5" width="88.05" height="18" rx="9" fill="#ffffff" stroke="#7048e8" stroke-opacity="0.45"/><text x="560" y="519.4" font-size="10" fill="#3a434f" text-anchor="middle">live progress</text><g><rect x="300" y="83" width="130.2" height="26" rx="8" fill="#ffffff" stroke="#0ca678" stroke-width="1.2"/><text x="365.1" y="100.5" font-size="12" font-weight="700" fill="#0b6e4f" text-anchor="middle">FastAPI endpoints</text></g><g><rect x="610" y="175" width="169.79999999999998" height="26" rx="8" fill="#ffffff" stroke="#0ca678" stroke-width="1.2"/><text x="694.9" y="192.5" font-size="12" font-weight="700" fill="#0b6e4f" text-anchor="middle">Background asyncio task</text></g><g><title>React SPA (browser) — ① uploads .docx; ② starts the run; ③ polls + WebSocket; ④ downloads .docx</title><rect x="40" y="185" width="210" height="190" rx="10" fill="#e7ecff" stroke="#4263eb" stroke-width="1.6" filter="url(#sh)"/><rect x="52" y="200" width="9" height="9" rx="2.5" fill="#4263eb"/><text x="68" y="209" font-size="13.5" font-weight="700" fill="#2b3a8c">React SPA (browser)</text><text x="54" y="226" font-size="11" fill="#5b6470">① uploads .docx</text><text x="54" y="241" font-size="11" fill="#5b6470">② starts the run</text><text x="54" y="256" font-size="11" fill="#5b6470">③ polls + WebSocket</text><text x="54" y="271" font-size="11" fill="#5b6470">④ downloads .docx</text></g><g><title>POST /api/upload — validate type + size (≤10 MB); create run + 12 steps</title><rect x="300" y="120" width="250" height="74" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="312" y="135" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="328" y="144" font-size="13.5" font-weight="700" fill="#0b6e4f">POST /api/upload</text><text x="314" y="161" font-size="11" fill="#5b6470">validate type + size (≤10 MB)</text><text x="314" y="176" font-size="11" fill="#5b6470">create run + 12 steps</text></g><g><title>POST /run/{id}/start — admission gate → background task</title><rect x="300" y="210" width="250" height="72" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="312" y="225" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="328" y="234" font-size="13.5" font-weight="700" fill="#0b6e4f">POST /run/{id}/start</text><text x="314" y="251" font-size="11" fill="#5b6470">admission gate → background task</text></g><g><title>GET /run/{id}/status — run + 12 step states (cost)</title><rect x="300" y="300" width="250" height="70" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="312" y="315" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="328" y="324" font-size="13.5" font-weight="700" fill="#0b6e4f">GET /run/{id}/status</text><text x="314" y="341" font-size="11" fill="#5b6470">run + 12 step states (cost)</text></g><g><title>GET /run/{id}/data/{f} — resolves a download URL</title><rect x="300" y="388" width="250" height="70" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="312" y="403" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="328" y="412" font-size="13.5" font-weight="700" fill="#0b6e4f">GET /run/{id}/data/{f}</text><text x="314" y="429" font-size="11" fill="#5b6470">resolves a download URL</text></g><g><title>Background run — per-pod gate:; CVICHE_MAX_CONCURRENT_RUNS; (429 when full); asyncio.run(execute)</title><rect x="610" y="206" width="240" height="120" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="622" y="221" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="638" y="230" font-size="13.5" font-weight="700" fill="#0b6e4f">Background run</text><text x="624" y="247" font-size="11" fill="#5b6470">per-pod gate:</text><text x="624" y="262" font-size="11" fill="#5b6470">CVICHE_MAX_CONCURRENT_RUNS</text><text x="624" y="277" font-size="11" fill="#5b6470">(429 when full)</text><text x="624" y="292" font-size="11" fill="#5b6470">asyncio.run(execute)</text></g><g><title>PipelineOrchestrator — runs the 12 stages (view ②); writes DB + storage; emits step events</title><rect x="900" y="206" width="240" height="120" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="912" y="221" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="928" y="230" font-size="13.5" font-weight="700" fill="#0b6e4f">PipelineOrchestrator</text><text x="914" y="247" font-size="11" fill="#5b6470">runs the 12 stages (view ②)</text><text x="914" y="262" font-size="11" fill="#5b6470">writes DB + storage</text><text x="914" y="277" font-size="11" fill="#5b6470">emits step events</text></g><g><title>Live progress — WebSocket /ws/run/{id}/stream; + Redis broker (replicas &gt; 1)</title><rect x="610" y="398" width="240" height="92" rx="10" fill="#e7ecff" stroke="#4263eb" stroke-width="1.6" filter="url(#sh)"/><rect x="622" y="413" width="9" height="9" rx="2.5" fill="#4263eb"/><text x="638" y="422" font-size="13.5" font-weight="700" fill="#2b3a8c">Live progress</text><text x="624" y="439" font-size="11" fill="#5b6470">WebSocket /ws/run/{id}/stream</text><text x="624" y="454" font-size="11" fill="#5b6470">+ Redis broker (replicas &gt; 1)</text></g><g><title>Run database — runs · steps; logs · cost / tokens</title><rect x="1180" y="150" width="160" height="84" rx="10" fill="#fff4d6" stroke="#f08c00" stroke-width="1.6" filter="url(#sh)"/><rect x="1192" y="165" width="9" height="9" rx="2.5" fill="#f08c00"/><text x="1208" y="174" font-size="13.5" font-weight="700" fill="#8a5a00">Run database</text><text x="1194" y="191" font-size="11" fill="#5b6470">runs · steps</text><text x="1194" y="206" font-size="11" fill="#5b6470">logs · cost / tokens</text></g><g><title>Storage — uploads + outputs; S3 / local</title><rect x="1180" y="268" width="160" height="90" rx="10" fill="#fff4d6" stroke="#f08c00" stroke-width="1.6" filter="url(#sh)"/><rect x="1192" y="283" width="9" height="9" rx="2.5" fill="#f08c00"/><text x="1208" y="292" font-size="13.5" font-weight="700" fill="#8a5a00">Storage</text><text x="1194" y="309" font-size="11" fill="#5b6470">uploads + outputs</text><text x="1194" y="324" font-size="11" fill="#5b6470">S3 / local</text></g></svg>
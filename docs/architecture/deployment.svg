<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 560" width="1450" height="560" role="img" aria-labelledby="t-deployment d-deployment" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="t-deployment">Deployment topology (EKS)</title><desc id="d-deployment">Kustomize renders a base + prod overlay into namespace cviche-prod on EKS. An ALB Ingress terminates TLS for cviche.weill.cornell.edu and routes /api + /ws to the backend Deployment and everything else to the frontend. In prod the backend runs 2 replicas (2 vCPU / 2Gi each) under an HPA (CPU 70%, 2–4 pods); it reaches Bedrock through an IRSA ServiceAccount and reads MariaDB + S3. Auth config, SAML certs, and DB secrets are mounted from a ConfigMap and Secrets.</desc><rect width="100%" height="100%" fill="#fbfcfe"/><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="2.4" flood-color="#0b1f3a" flood-opacity="0.14"/></filter><marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#868e96"/></marker><marker id="mMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7d1c1c"/></marker><marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#e03131"/></marker><marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#2f9e44"/></marker><marker id="mIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#4263eb"/></marker><marker id="mViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7048e8"/></marker><marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#f08c00"/></marker><marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#0ca678"/></marker></defs><rect x="560" y="92" width="600" height="430" rx="14" fill="#e3faf3" fill-opacity="0.16" stroke="#0ca678" stroke-width="1.4"><title>EKS · namespace cviche-prod</title></rect><rect x="1180" y="100" width="260" height="360" rx="14" fill="#fff4d6" fill-opacity="0.16" stroke="#f08c00" stroke-width="1.4"><title>AWS managed</title></rect><path d="M220,288 C256,288 234,288 270,288" fill="none" stroke="#7d1c1c" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mMaroon)"/><path d="M500,263 C542.7495075995034,263 537.2504924004966,166 580,166" fill="none" stroke="#4263eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mIndigo)"/><path d="M500,313 C536,313 544,310 580,310" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mGreen)"/><path d="M705,410 C705,374 705,406 705,370" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#mGreen)"/><path d="M830,304 C866,304 864,289 900,289" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mViolet)"/><path d="M830,264.4 C866,264.4 864,187.2 900,187.2" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M1140,289 C1183.500073563156,289 1156.499926436844,176 1200,176" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mViolet)"/><path d="M830,343.6 L865,344 L1170,344 L1200,270.4" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M830,364 C956.1597019654057,364 1073.8402980345943,392 1200,392" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><rect x="224.375" y="278.5" width="41.25" height="18" rx="9" fill="#ffffff" stroke="#7d1c1c" stroke-opacity="0.45"/><text x="245" y="291.4" font-size="10" fill="#3a434f" text-anchor="middle">HTTPS</text><rect x="495.975" y="205" width="88.05" height="18" rx="9" fill="#ffffff" stroke="#4263eb" stroke-opacity="0.45"/><text x="540" y="217.9" font-size="10" fill="#3a434f" text-anchor="middle">/  (frontend)</text><rect x="504.75" y="302" width="70.5" height="18" rx="9" fill="#ffffff" stroke="#2f9e44" stroke-opacity="0.45"/><text x="540" y="314.9" font-size="10" fill="#3a434f" text-anchor="middle">/api · /ws</text><rect x="669.75" y="380.5" width="70.5" height="18" rx="9" fill="#ffffff" stroke="#2f9e44" stroke-opacity="0.45"/><text x="705" y="393.4" font-size="10" fill="#3a434f" text-anchor="middle">scales 2–4</text><rect x="823.9" y="287" width="82.19999999999999" height="18" rx="9" fill="#ffffff" stroke="#7048e8" stroke-opacity="0.45"/><text x="865" y="299.9" font-size="10" fill="#3a434f" text-anchor="middle">assumes role</text><rect x="841.45" y="216.29999999999998" width="47.099999999999994" height="18" rx="9" fill="#ffffff" stroke="#f08c00" stroke-opacity="0.45"/><text x="865" y="229.2" font-size="10" fill="#3a434f" text-anchor="middle">mounts</text><rect x="1123.05" y="223" width="93.89999999999999" height="18" rx="9" fill="#ffffff" stroke="#7048e8" stroke-opacity="0.45"/><text x="1170" y="235.9" font-size="10" fill="#3a434f" text-anchor="middle">Bedrock (IRSA)</text><rect x="829.75" y="334.5" width="70.5" height="18" rx="9" fill="#ffffff" stroke="#f08c00" stroke-opacity="0.45"/><text x="865" y="347.4" font-size="10" fill="#3a434f" text-anchor="middle">SQLAlchemy</text><rect x="994.375" y="368.5" width="41.25" height="18" rx="9" fill="#ffffff" stroke="#f08c00" stroke-opacity="0.45"/><text x="1015" y="381.4" font-size="10" fill="#3a434f" text-anchor="middle">boto3</text><g><rect x="576" y="79" width="196.2" height="26" rx="8" fill="#ffffff" stroke="#0ca678" stroke-width="1.2"/><text x="674.1" y="96.5" font-size="12" font-weight="700" fill="#0b6e4f" text-anchor="middle">EKS · namespace cviche-prod</text></g><g><rect x="1196" y="87" width="90.6" height="26" rx="8" fill="#ffffff" stroke="#f08c00" stroke-width="1.2"/><text x="1241.3" y="104.5" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">AWS managed</text></g><g><title>Browser — cviche.weill.cornell.edu</title><rect x="40" y="250" width="180" height="76" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6" filter="url(#sh)"/><rect x="52" y="265" width="9" height="9" rx="2.5" fill="#868e96"/><text x="68" y="274" font-size="13.5" font-weight="700" fill="#343a40">Browser</text><text x="54" y="291" font-size="11" fill="#5b6470">cviche.weill.cornell.edu</text></g><g><title>ALB Ingress — AWS LB Controller; HTTP 80 → 443 redirect; /api → backend · / → frontend</title><rect x="270" y="238" width="230" height="100" rx="10" fill="#fbeaea" stroke="#7d1c1c" stroke-width="1.6" filter="url(#sh)"/><rect x="282" y="253" width="9" height="9" rx="2.5" fill="#7d1c1c"/><text x="298" y="262" font-size="13.5" font-weight="700" fill="#5e1414">ALB Ingress</text><text x="284" y="279" font-size="11" fill="#5b6470">AWS LB Controller</text><text x="284" y="294" font-size="11" fill="#5b6470">HTTP 80 → 443 redirect</text><text x="284" y="309" font-size="11" fill="#5b6470">/api → backend · / → frontend</text></g><g><title>frontend Deployment — React build (nginx); Service :80 · replicas 1; req 500m / 512Mi</title><rect x="580" y="120" width="250" height="92" rx="10" fill="#e7ecff" stroke="#4263eb" stroke-width="1.6" filter="url(#sh)"/><rect x="592" y="135" width="9" height="9" rx="2.5" fill="#4263eb"/><text x="608" y="144" font-size="13.5" font-weight="700" fill="#2b3a8c">frontend Deployment</text><text x="594" y="161" font-size="11" fill="#5b6470">React build (nginx)</text><text x="594" y="176" font-size="11" fill="#5b6470">Service :80 · replicas 1</text><text x="594" y="191" font-size="11" fill="#5b6470">req 500m / 512Mi</text></g><g><title>backend Deployment — FastAPI · uvicorn :8000; prod: replicas 2, req/lim 2 vCPU / 2Gi; CVICHE_MAX_CONCURRENT_RUNS=3</title><rect x="580" y="250" width="250" height="120" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="592" y="265" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="608" y="274" font-size="13.5" font-weight="700" fill="#0b6e4f">backend Deployment</text><text x="594" y="291" font-size="11" fill="#5b6470">FastAPI · uvicorn :8000</text><text x="594" y="306" font-size="11" fill="#5b6470">prod: replicas 2, req/lim 2 vCPU / 2Gi</text><text x="594" y="321" font-size="11" fill="#5b6470">CVICHE_MAX_CONCURRENT_RUNS=3</text></g><g><title>HorizontalPodAutoscaler — CPU 70% · min 2 / max 4; (prod overlay only)</title><rect x="580" y="410" width="250" height="70" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="592" y="425" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="608" y="434" font-size="13.5" font-weight="700" fill="#0b6e4f">HorizontalPodAutoscaler</text><text x="594" y="451" font-size="11" fill="#5b6470">CPU 70% · min 2 / max 4</text><text x="594" y="466" font-size="11" fill="#5b6470">(prod overlay only)</text></g><g><title>Mounted config — auth_config.yaml (ConfigMap); SAML key/crt (Secret); db.env + secrets (Secret)</title><rect x="900" y="120" width="240" height="96" rx="10" fill="#fff4d6" stroke="#f08c00" stroke-width="1.6" filter="url(#sh)"/><rect x="912" y="135" width="9" height="9" rx="2.5" fill="#f08c00"/><text x="928" y="144" font-size="13.5" font-weight="700" fill="#8a5a00">Mounted config</text><text x="914" y="161" font-size="11" fill="#5b6470">auth_config.yaml (ConfigMap)</text><text x="914" y="176" font-size="11" fill="#5b6470">SAML key/crt (Secret)</text><text x="914" y="191" font-size="11" fill="#5b6470">db.env + secrets (Secret)</text></g><g><title>ServiceAccount (IRSA) — cviche-sa; → cviche-bedrock-role</title><rect x="900" y="250" width="240" height="78" rx="10" fill="#f0ebff" stroke="#7048e8" stroke-width="1.6" filter="url(#sh)"/><rect x="912" y="265" width="9" height="9" rx="2.5" fill="#7048e8"/><text x="928" y="274" font-size="13.5" font-weight="700" fill="#4a2fb0">ServiceAccount (IRSA)</text><text x="914" y="291" font-size="11" fill="#5b6470">cviche-sa</text><text x="914" y="306" font-size="11" fill="#5b6470">→ cviche-bedrock-role</text></g><g><title>AWS Bedrock — Claude Sonnet 4.6 / Haiku 4.5; via IRSA role</title><rect x="1200" y="120" width="220" height="80" rx="10" fill="#f0ebff" stroke="#7048e8" stroke-width="1.6" filter="url(#sh)"/><rect x="1212" y="135" width="9" height="9" rx="2.5" fill="#7048e8"/><text x="1228" y="144" font-size="13.5" font-weight="700" fill="#4a2fb0">AWS Bedrock</text><text x="1214" y="161" font-size="11" fill="#5b6470">Claude Sonnet 4.6 / Haiku 4.5</text><text x="1214" y="176" font-size="11" fill="#5b6470">via IRSA role</text></g><g><title>MariaDB — CVICHE_DATABASE_URL</title><rect x="1200" y="232" width="220" height="64" rx="10" fill="#fff4d6" stroke="#f08c00" stroke-width="1.6" filter="url(#sh)"/><rect x="1212" y="247" width="9" height="9" rx="2.5" fill="#f08c00"/><text x="1228" y="256" font-size="13.5" font-weight="700" fill="#8a5a00">MariaDB</text><text x="1214" y="273" font-size="11" fill="#5b6470">CVICHE_DATABASE_URL</text></g><g><title>Amazon S3 — cviche/runs/{id}/…</title><rect x="1200" y="360" width="220" height="64" rx="10" fill="#fff4d6" stroke="#f08c00" stroke-width="1.6" filter="url(#sh)"/><rect x="1212" y="375" width="9" height="9" rx="2.5" fill="#f08c00"/><text x="1228" y="384" font-size="13.5" font-weight="700" fill="#8a5a00">Amazon S3</text><text x="1214" y="401" font-size="11" fill="#5b6470">cviche/runs/{id}/…</text></g></svg>